<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Calculate your total tax quickly and easily.">
    <title>Modern Tax Calculator</title>
    <!-- Modern typography -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="calculator-container">
        <header>
            <h1>Tax Calculator</h1>
            <p>Estimate your tax liability instantly.</p>
        </header>

        <main>
            <!-- Success message -->
            <div id="success-message" class="success-message hidden">
                Calculation successful!
            </div>

            <form id="tax-form" novalidate>
                <div class="input-group">
                    <label for="income">Annual Income</label>
                    <div class="input-wrapper">
                        <span class="currency-symbol">$</span>
                        <input type="number" id="income" name="income" placeholder="e.g. 50000" min="0" step="0.01" required>
                    </div>
                    <span class="error-message" id="income-error"></span>
                </div>

                <div class="input-group">
                    <label for="taxRate">Tax Rate</label>
                    <div class="input-wrapper">
                        <span class="percent-symbol">%</span>
                        <input type="number" id="taxRate" name="taxRate" placeholder="e.g. 20" min="0" max="100" step="0.1" required>
                    </div>
                    <span class="error-message" id="taxrate-error"></span>
                </div>

                <div class="button-group">
                    <button type="submit" class="calculate-btn">Calculate</button>
                    <!-- Reset button added -->
                    <button type="button" class="reset-btn" id="reset-btn">Reset</button>
                </div>
            </form>

            <div id="result-container" class="result-container hidden">
                <div class="result-card">
                    <h2>Total Tax</h2>
                    <div class="tax-amount" id="tax-amount">$0.00</div>
                    <div class="tax-summary" id="tax-summary"></div>
                </div>
            </div>

            <div id="server-error" class="server-error hidden"></div>
        </main>
    </div>

    <script src="/js/main.js"></script>
</body>
</html>
