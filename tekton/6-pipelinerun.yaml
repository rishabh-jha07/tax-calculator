apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  generateName: tax-calculator-run-
spec:
  pipelineRef:
    name: tax-calculator-pipeline
  workspaces:
    - name: shared-workspace
      # Using a dynamically provisioned PersistentVolumeClaim to pass the code between isolated Task pods
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
  params:
    - name: repo-url
      # Replace with your actual GitHub repository URL
      value: "https://github.com/your-username/tax-calculator.git"
    - name: image-reference
      # Replace with your actual IBM Cloud Container Registry endpoint and namespace
      value: "us.icr.io/your-namespace/tax-calculator:latest"
